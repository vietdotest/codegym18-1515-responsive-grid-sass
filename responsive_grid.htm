<!DOCTYPE html>
<html lang="en"><head><title>Responsive Grid — SASS</title><meta http-equiv="Content-Type" content="text/html; charset=utf-8">

  <div class="gridcontent empty-column"></div>

  <div class="gridcontent empty-column"></div>

  </div>
</div>

  <div class="gridcontent footer-cell">
  </div>
</div>

</div>
